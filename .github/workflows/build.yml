name: Build APK
on: [push, workflow_dispatch]

# Token bawaan hanya boleh membaca repo (prinsip hak akses minimum)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action di-pin ke commit SHA (bukan tag yang bisa digeser)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: 21}

      # Versi persis sesuai package-lock.json (build reproducible)
      - run: npm ci
      - name: Audit dependensi (informasi, tidak menggagalkan build)
        continue-on-error: true
        run: npm run audit:prod
      - run: node prepare.js
      - run: npx cap add android

      - name: Buat ikon & splash TAPAK
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#14532d' --iconBackgroundColorDark '#14532d' --splashBackgroundColor '#14532d' --splashBackgroundColorDark '#14532d'

      # Ikon notifikasi (pin + telapak), teks/warna notifikasi rekaman, dan plugin "Simpan sebagai" (SAF).
      # Tanpa ini notifikasi rekaman memakai ikon launcher berwarna (tampil sebagai kotak putih) dan
      # tombol "Simpan ke perangkat" memakai cadangan folder Dokumen/TAPAK.
      - name: Pasang ikon notifikasi & plugin simpan berkas
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable"
          cp assets/android/ic_stat_tapak.xml "$RES/drawable/ic_stat_tapak.xml"
          python3 - <<'PY'
          p='android/app/src/main/res/values/strings.xml'
          s=open(p).read()
          add=('    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_tapak</string>\n'
               '    <string name="capacitor_background_geolocation_notification_color">#168C91</string>\n'
               '    <string name="capacitor_background_geolocation_notification_channel_name">Rekaman jejak TAPAK</string>\n')
          assert '</resources>' in s
          s=s.replace('</resources>',add+'</resources>')
          open(p,'w').write(s)
          PY
          JAVA=android/app/src/main/java/id/tapak/patroli
          test -f "$JAVA/MainActivity.java"
          cp native/FileSaverPlugin.java native/MainActivity.java "$JAVA/"
          grep -q registerPlugin "$JAVA/MainActivity.java"

      - name: Atur izin & keamanan AndroidManifest
        run: |
          python3 - <<'PY'
          import re, sys
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=['INTERNET','ACCESS_NETWORK_STATE','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','CAMERA','READ_MEDIA_IMAGES','POST_NOTIFICATIONS','FOREGROUND_SERVICE','FOREGROUND_SERVICE_LOCATION']
          add=''.join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms if f'android.permission.{x}"' not in s)
          add+='    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
          add+='    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          add+='    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
          s=s.replace('<application',add+'    <application',1)
          # Matikan backup (data lokasi/foto patroli tidak boleh bisa diekstrak lewat adb backup / cloud backup)
          if 'android:allowBackup=' in s:
              s=re.sub(r'android:allowBackup="[^"]*"','android:allowBackup="false"',s)
          else:
              s=s.replace('<application','<application android:allowBackup="false"',1)
          # Larang lalu lintas HTTP tanpa enkripsi
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application','<application android:usesCleartextTraffic="false"',1)
          open(p,'w').write(s)
          assert 'android:allowBackup="false"' in s, 'allowBackup gagal dimatikan'
          assert 'usesCleartextTraffic="false"' in s, 'cleartext gagal dimatikan'
          PY 
          grep -E "uses-(permission|feature)|allowBackup|usesCleartext" android/app/src/main/AndroidManifest.xml

      - name: Atur versi (versionCode naik tiap build agar APK bisa menimpa versi lama)
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${VN}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - run: npx cap sync android

      # Rahasia penandatanganan HANYA tersedia di langkah ini (tidak terekspos ke npm/gradle lain)
      - name: Build & tandatangani APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VN=$(node -p "require('./package.json').version")
          cd android && chmod +x gradlew
          if [ -n "${KS_B64:-}" ]; then
              echo "Mode RELEASE: signing dengan PKCS12"

              ./gradlew assembleRelease

              BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

              # Decode keystore
              printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

              # Pastikan file berhasil dibuat
              test -s "$RUNNER_TEMP/release.jks"

              # Periksa isi keystore di GitHub Runner
              echo "Memeriksa keystore..."
              keytool -list \
                -keystore "$RUNNER_TEMP/release.jks" \
                -storetype PKCS12 \
                -storepass "$KS_PASS"

              # Signing APK
              export KEY_PASS="${KEY_PASS:-$KS_PASS}"

              "$BT/zipalign" -p -f 4 \
                app/build/outputs/apk/release/app-release-unsigned.apk \
                "$RUNNER_TEMP/aligned.apk"

              "$BT/apksigner" sign \
                --ks "$RUNNER_TEMP/release.jks" \
                --ks-type PKCS12 \
                --ks-pass env:KS_PASS \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass env:KEY_PASS \
                --out "../TAPAK-v${VN}.apk" \
                "$RUNNER_TEMP/aligned.apk"

              "$BT/apksigner" verify --verbose "../TAPAK-v${VN}.apk"

              rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
            else
              echo "::warning::Keystore belum diisi."
              ./gradlew assembleDebug
              cp app/build/outputs/apk/debug/app-debug.apk "../TAPAK-v${VN}-DEBUG-jangan-dibagikan.apk"
            fi
            cd .. && sha256sum TAPAK-*.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TAPAK-APK
          path: |
            TAPAK-*.apk
            SHA256SUMS.txt
